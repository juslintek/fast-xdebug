name: Release binaries

# Build Linux .so artifacts for every supported PHP version when a version tag
# is pushed, and attach them to the GitHub release. PIE's "pre-packaged-binary"
# download method (see composer.json) can then install without a compiler on
# the user's machine.
#
# NOTE: this workflow runs on GitHub's runners; it cannot be executed from a
# local sandbox. Push a tag (e.g. v0.4.0) and it populates that release.

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing tag to build binaries for'
        required: true

permissions:
  contents: write

jobs:
  linux:
    name: Linux .so — PHP ${{ matrix.php }} (${{ matrix.ts }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.2', '8.3', '8.4', '8.5']
        ts: ['nts', 'zts']
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}

      - name: Install PHP ${{ matrix.php }} (${{ matrix.ts }})
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          # Remove the real Xdebug so it never co-loads with swiftcov during the
          # smoke test (both claim the "xdebug" module name -> SIGSEGV in
          # php_module_startup).
          coverage: none
          extensions: ":xdebug, :pcov"
        env:
          phpts: ${{ matrix.ts }}

      - name: Build tools
        run: sudo apt-get update && sudo apt-get install -y build-essential autoconf

      - name: Build
        run: |
          phpize
          ./configure --enable-swiftcov --with-php-config="$(command -v php-config)"
          make -j"$(nproc)"

      - name: Package the .so with a descriptive name
        id: pkg
        env:
          TAG_INPUT: ${{ github.event.inputs.tag || github.ref_name }}
        run: |
          case "$TAG_INPUT" in
            v[0-9]*|[0-9]*) ;;
            *) echo "invalid tag format: $TAG_INPUT" >&2; exit 1;;
          esac
          API=$(php -i | awk -F'=> ' '/PHP Extension =>/ {print $2; exit}')
          NAME="swiftcov-${TAG_INPUT}-php${{ matrix.php }}-${{ matrix.ts }}-linux-x86_64-api${API}.so"
          cp modules/swiftcov.so "$NAME"
          sha256sum "$NAME" > "$NAME.sha256"
          echo "artifact=$NAME" >> "$GITHUB_OUTPUT"

      - name: Smoke-test the built binary
        run: |
          php -n -d extension="$PWD/modules/swiftcov.so" -r '
            assert(extension_loaded("xdebug"));
            assert(in_array("coverage", xdebug_info("mode"), true));
            echo swiftcov_engine(), " OK\n";
          '

      - name: Upload to the release
        # only when triggered by a tag (a real release exists)
        if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.tag || github.ref_name }}
          files: |
            ${{ steps.pkg.outputs.artifact }}
            ${{ steps.pkg.outputs.artifact }}.sha256
          fail_on_unmatched_files: true

  source-tarball:
    name: Source tarball + PECL package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          tools: pecl
          # Keep the real Xdebug out so it cannot co-load with swiftcov (both
          # claim the "xdebug" module name -> SIGSEGV in php_module_startup).
          coverage: none
          extensions: ":xdebug, :pcov"
      - name: Build PECL package + plain source tarball
        env:
          TAG_INPUT: ${{ github.event.inputs.tag || github.ref_name }}
        run: |
          case "$TAG_INPUT" in
            v[0-9]*|[0-9]*) ;;
            *) echo "invalid tag format: $TAG_INPUT" >&2; exit 1;;
          esac
          pecl package package.xml
          TAG="$TAG_INPUT"
          git archive --format=tar.gz --prefix="swiftcov-${TAG#v}/" -o "swiftcov-${TAG#v}-src.tar.gz" HEAD
      - name: Upload to the release
        if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.tag || github.ref_name }}
          files: |
            swiftcov-*.tgz
            swiftcov-*-src.tar.gz
          fail_on_unmatched_files: false

  # Optional: build (and, if registry creds are configured, push) the Docker
  # image on tags. Guarded by the presence of DOCKERHUB_USERNAME/DOCKERHUB_TOKEN
  # secrets — the whole job is skipped cleanly when they are absent, so forks
  # without credentials are unaffected.
  docker-image:
    name: Docker image — PHP ${{ matrix.php }}
    runs-on: ubuntu-latest
    if: ${{ startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch' }}
    strategy:
      fail-fast: false
      matrix:
        php: ['8.2', '8.3', '8.4']
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}
      - name: Check for registry credentials
        id: creds
        run: |
          if [ -n "${{ secrets.DOCKERHUB_USERNAME }}" ] && [ -n "${{ secrets.DOCKERHUB_TOKEN }}" ]; then
            echo "have=true" >> "$GITHUB_OUTPUT"
          else
            echo "have=false" >> "$GITHUB_OUTPUT"
            echo "No DOCKERHUB_* secrets — building locally, not pushing."
          fi
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Log in to Docker Hub
        if: steps.creds.outputs.have == 'true'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Build (and push if creds present)
        uses: docker/build-push-action@v6
        with:
          context: .
          build-args: |
            PHP_VERSION=${{ matrix.php }}
          push: ${{ steps.creds.outputs.have == 'true' }}
          tags: juslintek/swiftcov:php${{ matrix.php }}
