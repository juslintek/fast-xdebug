name: Release binaries

# Build Linux .so artifacts for every supported PHP version when a version tag
# is pushed, and attach them to the GitHub release. PIE's "pre-packaged-binary"
# download method (see composer.json) can then install without a compiler on
# the user's machine.
#
# NOTE: this workflow runs on GitHub's runners; it cannot be executed from a
# local sandbox. Push a tag (e.g. v0.4.0) and it populates that release.

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing tag to build binaries for'
        required: true

permissions:
  contents: write

jobs:
  linux:
    name: Linux .so — PHP ${{ matrix.php }} (${{ matrix.ts }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.2', '8.3', '8.4', '8.5']
        ts: ['nts', 'zts']
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}

      - name: Install PHP ${{ matrix.php }} (${{ matrix.ts }})
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
        env:
          phpts: ${{ matrix.ts }}

      - name: Build tools
        run: sudo apt-get update && sudo apt-get install -y build-essential autoconf

      - name: Build
        run: |
          phpize
          ./configure --enable-fast-xdebug --with-php-config="$(command -v php-config)"
          make -j"$(nproc)"

      - name: Package the .so with a descriptive name
        id: pkg
        run: |
          API=$(php -i | awk -F'=> ' '/PHP Extension =>/ {print $2; exit}')
          NAME="fast_xdebug-${{ github.event.inputs.tag || github.ref_name }}-php${{ matrix.php }}-${{ matrix.ts }}-linux-x86_64-api${API}.so"
          cp modules/fast_xdebug.so "$NAME"
          sha256sum "$NAME" > "$NAME.sha256"
          echo "artifact=$NAME" >> "$GITHUB_OUTPUT"

      - name: Smoke-test the built binary
        run: |
          php -n -d extension="$PWD/modules/fast_xdebug.so" -r '
            assert(extension_loaded("xdebug"));
            assert(in_array("coverage", xdebug_info("mode"), true));
            echo fast_xdebug_engine(), " OK\n";
          '

      - name: Upload to the release
        # only when triggered by a tag (a real release exists)
        if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.tag || github.ref_name }}
          files: |
            ${{ steps.pkg.outputs.artifact }}
            ${{ steps.pkg.outputs.artifact }}.sha256
          fail_on_unmatched_files: true

  source-tarball:
    name: Source tarball + PECL package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          tools: pecl
      - name: Build PECL package + plain source tarball
        run: |
          pecl package package.xml || true
          TAG="${{ github.event.inputs.tag || github.ref_name }}"
          git archive --format=tar.gz --prefix="fast-xdebug-${TAG#v}/" -o "fast-xdebug-${TAG#v}-src.tar.gz" HEAD
      - name: Upload to the release
        if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.tag || github.ref_name }}
          files: |
            fast_xdebug-*.tgz
            fast-xdebug-*-src.tar.gz
          fail_on_unmatched_files: false
