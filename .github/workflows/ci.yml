name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-and-test:
    name: PHP ${{ matrix.php }} (${{ matrix.ts }})
    runs-on: ubuntu-latest
    # A ZTS runner build depends on an external (ondrej/php) ZTS package that is
    # not always available; don't let its absence fail the whole matrix. The NTS
    # rows across 8.2-8.5 are the blocking gate.
    continue-on-error: ${{ matrix.ts == 'zts' }}
    strategy:
      fail-fast: false
      matrix:
        php: ['8.2', '8.3', '8.4', '8.5']
        ts: ['nts']
        include:
          - php: '8.4'
            ts: 'zts'
    steps:
      - uses: actions/checkout@v4

      - name: Install PHP (with dev headers)
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
        env:
          # setup-php: "nts" (default) or "ts"/"zts" for a thread-safe build.
          phpts: ${{ matrix.ts }}

      - name: Install build + validation tooling
        run: sudo apt-get update && sudo apt-get install -y valgrind gdb build-essential autoconf

      - name: phpize / configure / make
        run: |
          phpize
          ./configure --enable-swiftcov --with-php-config="$(command -v php-config)"
          make -j"$(nproc)"

      - name: Load smoke test (registers as xdebug)
        run: |
          # Primary, GATING smoke run: a real failure here must fail the job.
          # Do NOT add '|| true' to this invocation.
          php -n -d extension="$PWD/modules/swiftcov.so" -r '
            assert(extension_loaded("xdebug"));
            assert(version_compare(phpversion("xdebug"), "3.1", ">="));
            assert(in_array("coverage", xdebug_info("mode"), true));
            echo swiftcov_engine(), " OK\n";
          '

          # ======================================================================
          # >>> TEMPORARY DIAGNOSTIC (remove once CI is green) <<<
          # TODO(PR #1): DELETE THIS ENTIRE BLOCK once the load-time SIGSEGV is
          # resolved and CI is green. Tracking: github.com/juslintek/fast-xdebug
          # pull/1 (search this file for "TEMPORARY DIAGNOSTIC" before release).
          # Added for PR #1 to diagnose a load-time SIGSEGV that only reproduces
          # under ondrej/setup-php (opcache+JIT on) and NOT in the offline sandbox.
          # These lines print an actionable backtrace and confirm/deny the
          # opcache-JIT root-cause hypothesis. They are diagnostic-only and are
          # guarded with '|| true' so they NEVER fail this step by themselves.
          # ----------------------------------------------------------------------
          # SMOKE is the EXACT payload of the gating smoke run above, so the gdb
          # backtrace below traces the precise `php -n -d extension=... -r <SMOKE>`
          # invocation that crashes -- guaranteeing the next CI run yields the
          # real stack trace of the failing path (not a different process).
          SMOKE='
            assert(extension_loaded("xdebug"));
            assert(version_compare(phpversion("xdebug"), "3.1", ">="));
            assert(in_array("coverage", xdebug_info("mode"), true));
            echo swiftcov_engine(), " OK\n";
          '

          # Allow core dumps so a trace is recoverable even if the live gdb run
          # below cannot attach for some reason.
          ulimit -c unlimited || true

          echo "::group::[DIAGNOSTIC] gdb backtrace of the EXACT gating smoke run"
          # Run under gdb; try the rich trace first, then fall back to a plain
          # 'bt' so we still capture a stack even if 'bt full' is unavailable.
          gdb -batch \
            -ex 'set pagination off' \
            -ex run \
            -ex 'bt full' \
            -ex 'bt' \
            -ex 'info registers' \
            -ex 'thread apply all bt' \
            --args php -n -d extension="$PWD/modules/swiftcov.so" -r "$SMOKE" || true
          echo "::endgroup::"

          # JIT-hypothesis control runs. Locate opcache.so gracefully (may be absent).
          OPCACHE_SO="$(php -n -r 'foreach (explode(PATH_SEPARATOR, ini_get("extension_dir") ?: "") as $d) { $p = $d . "/opcache.so"; if (is_file($p)) { echo $p; break; } }' 2>/dev/null || true)"

          echo "::group::[DIAGNOSTIC] smoke run with opcache + JIT explicitly ON (JIT-on path)"
          if [ -n "$OPCACHE_SO" ]; then
            php -n -d extension="$PWD/modules/swiftcov.so" \
              -d zend_extension="$OPCACHE_SO" \
              -d opcache.enable_cli=1 -d opcache.jit_buffer_size=64M -d opcache.jit=tracing \
              -r "$SMOKE" || true
          else
            echo "[DIAGNOSTIC] opcache.so not found in extension_dir; skipping JIT-on control." || true
          fi
          echo "::endgroup::"

          echo "::group::[DIAGNOSTIC] smoke run with opcache explicitly OFF (JIT-off path)"
          php -n -d extension="$PWD/modules/swiftcov.so" \
            -d opcache.enable_cli=0 \
            -r "$SMOKE" || true
          echo "::endgroup::"
          # >>> END TEMPORARY DIAGNOSTIC <<<
          # ======================================================================

      - name: .phpt test suite
        run: |
          php -n run-tests.php -q -p "$(command -v php)" \
            -d extension="$PWD/modules/swiftcov.so" tests/*.phpt

      - name: Valgrind — frameless internal-call regression
        run: |
          cat > /tmp/frameless.php <<'PHP'
          <?php
          $needle = 'x';
          $haystack = ['a', 'b'];
          xdebug_start_code_coverage(XDEBUG_CC_BRANCH_CHECK);
          in_array($needle, $haystack);
          $d = xdebug_get_code_coverage();
          echo "survived\n";
          PHP
          USE_ZEND_ALLOC=0 valgrind --error-exitcode=99 -q \
            php -n -d extension="$PWD/modules/swiftcov.so" /tmp/frameless.php

  integration:
    name: php-code-coverage / PHPUnit integration (PHP ${{ matrix.php }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.2', '8.3', '8.4']
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          tools: composer
      - run: sudo apt-get update && sudo apt-get install -y build-essential autoconf
      - name: Build extension
        run: |
          phpize && ./configure --enable-swiftcov --with-php-config="$(command -v php-config)" && make -j"$(nproc)"
      - name: Run the integration harness (PHPUnit --path-coverage -> Cobertura)
        run: |
          cd tests/integration
          composer install --no-interaction
          php -n -d extension="$GITHUB_WORKSPACE/modules/swiftcov.so" -d memory_limit=512M \
            ./vendor/bin/phpunit --path-coverage --coverage-cobertura=cobertura.xml
          # assert the report is well-formed and carries branch data
          php -r '$x=simplexml_load_file("cobertura.xml"); if(!$x||!isset($x["branches-valid"])){fwrite(STDERR,"bad cobertura\n");exit(1);} echo "cobertura OK: branches-valid=",$x["branches-valid"],"\n";'
