name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-and-test:
    name: PHP ${{ matrix.php }} (${{ matrix.ts }})
    runs-on: ubuntu-latest
    # A ZTS runner build depends on an external (ondrej/php) ZTS package that is
    # not always available; don't let its absence fail the whole matrix. The NTS
    # rows across 8.2-8.5 are the blocking gate.
    continue-on-error: ${{ matrix.ts == 'zts' }}
    strategy:
      fail-fast: false
      matrix:
        php: ['8.2', '8.3', '8.4', '8.5']
        ts: ['nts']
        include:
          - php: '8.4'
            ts: 'zts'
    steps:
      - uses: actions/checkout@v4

      - name: Install PHP (with dev headers)
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
        env:
          # setup-php: "nts" (default) or "ts"/"zts" for a thread-safe build.
          phpts: ${{ matrix.ts }}

      - name: Install build + validation tooling
        run: sudo apt-get update && sudo apt-get install -y valgrind gdb build-essential autoconf

      - name: phpize / configure / make
        run: |
          phpize
          ./configure --enable-swiftcov --with-php-config="$(command -v php-config)"
          make -j"$(nproc)"

      - name: Load smoke test (registers as xdebug)
        run: |
          # Primary, GATING smoke run: a real failure here must fail the job.
          # Do NOT add '|| true' to this invocation.
          php -n -d extension="$PWD/modules/swiftcov.so" -r '
            assert(extension_loaded("xdebug"));
            assert(version_compare(phpversion("xdebug"), "3.1", ">="));
            assert(in_array("coverage", xdebug_info("mode"), true));
            echo swiftcov_engine(), " OK\n";
          '

      - name: .phpt test suite
        run: |
          # Primary, GATING run: run-tests.php over the suite with the extension
          # loaded the way a user runs it (opcache remains co-loadable, which is
          # exactly what surfaced the load-time crash). Its exit status gates the
          # job and is the SOLE gate. Do NOT add '|| true' to this invocation and
          # do NOT append diagnostics here: this step runs under `bash -e`, so a
          # non-zero exit aborts the step immediately and anything after it would
          # never run. Crash diagnostics live in the dedicated `if: failure()`
          # step below so they execute precisely when this gate fails.
          php -n run-tests.php -q -p "$(command -v php)" \
            -d extension="$PWD/modules/swiftcov.so" tests/*.phpt

      # TEMPORARY DIAGNOSTIC - TODO(PR #1): remove this entire step once CI is
      # confirmed green. It runs ONLY when a prior step failed (`if: failure()`),
      # which in practice means the gating `.phpt test suite` step above blew up
      # (the .phpt suite BORKs with Termsig=11 when system OPcache is co-loaded
      # with swiftcov). It changes NOTHING about pass/fail: `set +e` plus a
      # per-command `|| true` guarantee the step always completes and prints
      # everything it can.
      #
      # Why a separate step: the `.phpt` step runs under `bash -e`, so its first
      # non-zero command (the gating run-tests.php) aborts that step instantly
      # and any trailing diagnostic block never executes; that is exactly why
      # earlier CI runs produced zero diagnostic output and no faulting stack.
      #
      # The run-tests.php PARENT does not crash, so tracing it yields no useful
      # backtrace. Instead we reproduce and gdb-trace the ACTUAL crashing CHILD
      # directly: a single php process co-loading the system OPcache with
      # swiftcov (no `-n`), plus controls to isolate the interaction.
      #
      # PRIME REMAINING HYPOTHESIS (for the human reading the CI log):
      #   This module registers its zend_module_entry name as the literal string
      #   "xdebug" and reports phpversion('xdebug') so that php-code-coverage's
      #   extension_loaded('xdebug') gate passes (see ADR-0001). ondrej's OPcache
      #   build may carry real-Xdebug-aware detection that, on finding a module
      #   NAMED "xdebug" that lacks the genuine Xdebug zend_extension registration
      #   and symbols, dereferences an unexpected/NULL pointer -> SIGSEGV.
      #   A SAFE future experiment is a diagnostic-only rebuild that registers the
      #   runtime name as "swiftcov" to see if the co-load crash disappears. Do
      #   NOT change the shipping runtime name here: php-code-coverage gates on
      #   extension_loaded('xdebug'); the shipping module MUST keep registering as
      #   "xdebug". This step only gathers evidence.
      - name: Crash backtrace diagnostic (TODO PR #1)
        if: ${{ failure() }}
        shell: bash
        run: |
          # TODO(PR #1) temporary: never abort, always print everything.
          set +e
          ulimit -c unlimited

          echo "===== TODO(PR #1) env / config ====="
          php --version || true
          php -m || true
          OPC="$(php-config --extension-dir)/opcache.so"
          echo "OPC=$OPC"
          ls -l "$OPC" || true

          echo "===== TODO(PR #1) Control A: opcache only ====="
          php -d zend_extension="$OPC" -d opcache.enable_cli=1 \
            -r 'echo "opcache-only OK\n";' || true

          echo "===== TODO(PR #1) Control B: swiftcov only (-n) ====="
          php -n -d extension="$PWD/modules/swiftcov.so" \
            -r 'echo "swiftcov-only OK\n";' || true

          echo "===== TODO(PR #1) gdb variant 1: opcache.enable_cli=1 + swiftcov ====="
          gdb -batch \
            -ex 'set pagination off' \
            -ex 'set confirm off' \
            -ex run \
            -ex 'bt full' \
            -ex 'thread apply all bt' \
            -ex 'info sharedlibrary' \
            --args php -d zend_extension="$OPC" -d opcache.enable_cli=1 \
            -d extension="$PWD/modules/swiftcov.so" \
            -r 'var_dump(extension_loaded("xdebug"));' || true

          echo "===== TODO(PR #1) gdb variant 2: opcache loaded, enable_cli OFF + swiftcov ====="
          # No opcache.enable_cli=1: distinguishes a co-load-at-startup crash
          # from an execution-time (caching-active) crash.
          gdb -batch \
            -ex 'set pagination off' \
            -ex 'set confirm off' \
            -ex run \
            -ex 'bt full' \
            -ex 'thread apply all bt' \
            -ex 'info sharedlibrary' \
            --args php -d zend_extension="$OPC" \
            -d extension="$PWD/modules/swiftcov.so" \
            -r 'var_dump(extension_loaded("xdebug"));' || true

          echo "===== TODO(PR #1) gdb variant 3: exact SKIPIF child (opcache + swiftcov) ====="
          # Runs the exact SKIPIF probe the .phpt harness executes, to pin whether
          # the SKIPIF child specifically triggers the fault.
          gdb -batch \
            -ex 'set pagination off' \
            -ex 'set confirm off' \
            -ex run \
            -ex 'bt full' \
            -ex 'thread apply all bt' \
            -ex 'info sharedlibrary' \
            --args php -d zend_extension="$OPC" -d opcache.enable_cli=1 \
            -d extension="$PWD/modules/swiftcov.so" \
            -r 'if (!extension_loaded("xdebug") || !function_exists("fast_xdebug_engine")) echo "skip";' || true

          echo "===== TODO(PR #1) core-file fallback ====="
          # If any run dumped a core, extract a backtrace from it.
          gdb -batch -ex 'bt full' php core* || true

      - name: Valgrind — frameless internal-call regression
        run: |
          cat > /tmp/frameless.php <<'PHP'
          <?php
          $needle = 'x';
          $haystack = ['a', 'b'];
          xdebug_start_code_coverage(XDEBUG_CC_BRANCH_CHECK);
          in_array($needle, $haystack);
          $d = xdebug_get_code_coverage();
          echo "survived\n";
          PHP
          USE_ZEND_ALLOC=0 valgrind --error-exitcode=99 -q \
            php -n -d extension="$PWD/modules/swiftcov.so" /tmp/frameless.php

  integration:
    name: php-code-coverage / PHPUnit integration (PHP ${{ matrix.php }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.2', '8.3', '8.4']
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          tools: composer
      - run: sudo apt-get update && sudo apt-get install -y build-essential autoconf
      - name: Build extension
        run: |
          phpize && ./configure --enable-swiftcov --with-php-config="$(command -v php-config)" && make -j"$(nproc)"
      - name: Run the integration harness (PHPUnit --path-coverage -> Cobertura)
        run: |
          cd tests/integration
          composer install --no-interaction
          php -n -d extension="$GITHUB_WORKSPACE/modules/swiftcov.so" -d memory_limit=512M \
            ./vendor/bin/phpunit --path-coverage --coverage-cobertura=cobertura.xml
          # assert the report is well-formed and carries branch data
          php -r '$x=simplexml_load_file("cobertura.xml"); if(!$x||!isset($x["branches-valid"])){fwrite(STDERR,"bad cobertura\n");exit(1);} echo "cobertura OK: branches-valid=",$x["branches-valid"],"\n";'
