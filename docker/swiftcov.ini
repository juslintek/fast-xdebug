; swiftcov — load as a NORMAL module (not a Zend extension).
; The build/package name is swiftcov; the runtime module registers as "xdebug".
extension=swiftcov.so

; Default to coverage mode so PHPUnit --coverage-* / --path-coverage work
; out of the box. Set XDEBUG_MODE / xdebug.mode=auto to override.
xdebug.mode=coverage
